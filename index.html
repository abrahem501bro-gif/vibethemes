<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeThemes | إبراهيم الشنوان</title>
    <style>
        :root {
            --bg-deep: #08090a;
            --bg-card: #11141a;
            --accent: #00f2fe;
            --accent-glow: rgba(0, 242, 254, 0.2);
            --text-main: #ffffff;
            --text-muted: #a0aec0;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background: radial-gradient(circle at top, #161b26 0%, var(--bg-deep) 70%);
            padding: 60px 20px;
            text-align: center;
            border-bottom: 1px solid #1f2733;
        }

        header h1 {
            font-size: 48px;
            margin: 0;
            font-weight: 800;
            color: #fff;
        }

        header h1 span {
            color: var(--accent);
            text-shadow: 0 0 20px var(--accent-glow);
        }

        header p {
            color: var(--text-muted);
            font-size: 18px;
            margin-top: 15px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .section-title {
            font-size: 24px;
            color: #fff;
            border-right: 4px solid var(--accent);
            padding-right: 12px;
            margin: 40px 0 25px 0;
        }

        .themes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .theme-card {
            background-color: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #1f2733;
            transition: all 0.3s ease;
        }

        .theme-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px var(--accent-glow);
        }

        .theme-img-wrapper {
            width: 100%;
            height: 190px;
            background: #161b26;
        }

        .theme-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .theme-info {
            padding: 25px;
        }

        .theme-info h3 {
            margin: 0 0 10px 0;
            font-size: 20px;
            color: #fff;
        }

        .theme-info p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0 0 25px 0;
            line-height: 1.6;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-download {
            background-color: var(--accent);
            color: #000;
            border: none;
        }

        .btn-download:hover {
            background-color: #00b4d8;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        .btn-preview {
            background-color: transparent;
            color: #fff;
            border: 1px solid #2d3748;
        }

        .btn-preview:hover {
            background-color: #161b26;
            border-color: #fff;
        }

        footer {
            background-color: #040506;
            padding: 50px 20px;
            text-align: center;
            border-top: 1px solid #11141a;
            margin-top: 100px;
        }

        footer .branding {
            font-size: 18px;
            color: var(--text-muted);
            margin: 0;
        }

        footer .branding strong {
            color: var(--accent);
            font-weight: 700;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        footer .copyright {
            font-size: 13px;
            color: #4a5568;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Vibe<span>Themes</span></h1>
        <p>المنصة الاحترافية الأولى لتنزيل وتخصيص أفضل ثيمات التطبيقات وقوالب المواقع</p>
    </header>

    <div class="container">
        <h2 class="section-title">ثيمات مضافة حديثاً عبر البوت</h2>
        
        <div class="themes-grid" id="themes-container">
            </div>
    </div>

    <footer>
        <p class="branding">بُني الموقع وتطويره بواسطة: <strong>إبراهيم الشنوان</strong></p>
        <p class="copyright">&copy; 2026 VibeThemes. جميع الحقوق محفوظة.</p>
    </footer>

    <script>
        const TELEGRAM_TOKEN = '8397760075:AAGWDrHjTN7Y0lZvEenbetj6CKq7Ve4KdNI';
        const proxyUrl = 'https://api.allorigins.win/raw?url=';
        const container = document.getElementById('themes-container');

        let savedThemes = JSON.parse(localStorage.getItem('vibe_themes')) || [];
        
        function forceDownload(url, filename) {
            window.open(url, '_blank');
        }
        
        function renderThemes() {
            if (savedThemes.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center; grid-column: 1/-1;">لا يوجد ثيمات مضافة حالياً. أرسل ملف الثيم أو أمراً للبوت ليتم التحديث فوراً!</p>';
                return;
            }
            container.innerHTML = savedThemes.map(theme => `
                <div class="theme-card">
                    <div class="theme-img-wrapper">
                        <img src="${theme.image || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&q=80'}" class="theme-img" alt="معاينة">
                    </div>
                    <div class="theme-info">
                        <h3>${theme.title}</h3>
                        <p>${theme.desc}</p>
                        <div class="btn-group">
                            <button onclick="forceDownload('${theme.file}', '${theme.title}.attheme')" class="btn btn-download">تحميل الثيم</button>
                            <a href="${theme.image}" target="_blank" class="btn btn-preview">معاينة حية</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        renderThemes();

        let lastUpdateId = parseInt(localStorage.getItem('last_update_id')) || 0;

        async function getTelegramFileUrl(fileId) {
            try {
                const res = await fetch(`${proxyUrl}${encodeURIComponent(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/getFile?file_id=${fileId}`)}`);
                const data = await res.json();
                if (data && data.file_path) {
                    return `https://api.telegram.org/file/bot${TELEGRAM_TOKEN}/${data.file_path}`;
                }
            } catch(e) { console.log(e); }
            return "";
        }

        async function checkBotUpdates() {
            try {
                const res = await fetch(`${proxyUrl}${encodeURIComponent(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/getUpdates?offset=${lastUpdateId + 1}&timeout=2`)}`);
                const data = await res.json();
                
                if(data && data.ok && data.result.length > 0) {
                    let hasNewThemes = false;

                    for(let update of data.result) {
                        lastUpdateId = update.update_id;
                        localStorage.setItem('last_update_id', lastUpdateId);

                        if (!update.message) continue;
                        
                        const chatId = update.message.chat.id;
                        let text = update.message.text || update.message.caption || "";
                        let fileUrl = "";
                        let title = "ثيم تيليجرام مميز";
                        let desc = "ثيم احترافي مضاف مباشرة عبر ملف التيليجرام.";

                        if (update.message.document) {
                            const doc = update.message.document;
                            if (doc.file_name.endsWith('.attheme') || doc.mime_type === 'application/x-tgtheme' || doc.file_name.includes('attheme')) {
                                title = doc.file_name.replace('.attheme', '');
                                fileUrl = await getTelegramFileUrl(doc.file_id);
                            }
                        }

                        if(text.trim().startsWith('/add')) {
                            const parts = text.replace('/add', '').trim().split('|');
                            if(parts.length >= 4) {
                                const newTheme = {
                                    title: parts[0].trim(),
                                    desc: parts[1].trim(),
                                    image: parts[2].trim(),
                                    file: parts[3].trim()
                                };
                                if (!savedThemes.some(t => t.file === newTheme.file)) {
                                    savedThemes.unshift(newTheme);
                                    hasNewThemes = true;
                                }
                                await sendConfirmation(chatId, newTheme.title);
                                continue;
                            }
                        }

                        if (fileUrl) {
                            const newTheme = {
                                title: title,
                                desc: desc,
                                image: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&q=80',
                                file: fileUrl
                            };
                            
                            if (!savedThemes.some(t => t.file === newTheme.file)) {
                                savedThemes.unshift(newTheme);
                                hasNewThemes = true;
                            }
                            await sendConfirmation(chatId, newTheme.title);
                        }
                    }

                    if (hasNewThemes) {
                        localStorage.setItem('vibe_themes', JSON.stringify(savedThemes));
                        renderThemes();
                    }
                }
            } catch (e) { console.log(e); }
        }

        async function sendConfirmation(chatId, themeTitle) {
            await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: `✅ كفو يا إبراهيم، تم إضافة ثيم (${themeTitle}) بنجاح للموقع الحين!`
                })
            });
        }

        setInterval(checkBotUpdates, 3000);
    </script>

</body>
</html>
