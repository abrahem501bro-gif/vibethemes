<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeBooks Digital Library</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

<style>
:root {
  --bg-color:#0b0f19;
  --card-bg:#151c2e;
  --primary:#3b82f6;
  --primary-hover:#2563eb;
  --text-main:#f3f4f6;
  --text-muted:#9ca3af;
  --accent:#10b981;
  --danger:#ef4444;
}
* { box-sizing:border-box; margin:0; padding:0; font-family:'Cairo',sans-serif; }
body { background-color:var(--bg-color); color:var(--text-main); min-height:100vh; padding-bottom:60px; }
header { background-color:var(--card-bg); padding:15px 20px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 4px 6px -1px rgba(0,0,0,0.3); position:sticky; top:0; z-index:100; }
.logo { font-size:22px; font-weight:800; color:var(--primary); text-shadow:0 0 10px rgba(59,130,246,0.3); }
.btn { background-color:var(--primary); color:white; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; font-weight:600; font-size:14px; transition:all 0.2s ease; }
.btn:hover { background-color:var(--primary-hover); transform:translateY(-1px); }
.btn-danger { background-color:var(--danger); }
.btn-danger:hover { background-color:#dc2626; }
.user-info { display:flex; align-items:center; gap:10px; }
.user-avatar { width:35px; height:35px; border-radius:50%; border:2px solid var(--primary); }
.container { max-width:1200px; margin:30px auto; padding:0 20px; }
.hero-section { text-align:center; margin-bottom:40px; }
.hero-section h1 { font-size:32px; margin-bottom:10px; }
.hero-section p { color:var(--text-muted); }
.actions-bar { display:flex; justify-content:center; gap:15px; margin-bottom:30px; flex-wrap:wrap; }
.modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background-color:rgba(0,0,0,0.7); z-index:1000; justify-content:center; align-items:center; padding:20px; }
.modal-content { background-color:var(--card-bg); padding:25px; border-radius:12px; width:100%; max-width:500px; position:relative; box-shadow:0 20px 25px -5px rgba(0,0,0,0.5); }
.close-btn { position:absolute; top:15px; left:15px; font-size:24px; cursor:pointer; color:var(--text-muted); }
.form-group { margin-bottom:15px; }
.form-group label { display:block; margin-bottom:5px; font-size:14px; }
.form-group input, .form-group textarea { width:100%; padding:10px; background-color:var(--bg-color); border:1px solid #2e3a56; border-radius:6px; color:white; font-size:14px; }
.books-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:25px; }
.book-card { background-color:var(--card-bg); border-radius:12px; padding:20px; display:flex; flex-direction:column; gap:12px; border:1px solid #1e293b; transition: transform 0.2s; }
.book-card:hover { transform:translateY(-4px); border-color:var(--primary); }
.book-title { font-size:18px; font-weight:600; }
.book-desc { color:var(--text-muted); font-size:14px; flex-grow:1; line-height:1.6; }
.admin-section { margin-top:50px; border-top:2px dashed #2e3a56; padding-top:30px; }
.hidden { display:none !important; }
.lang-switcher { display:flex; gap:10px; }
footer { text-align:center; padding:25px; color:#9ca3af; margin-top:50px; border-top:1px solid #2e3a56; }
.book-cover { width:100%; height:200px; object-fit:cover; border-radius:10px; }
</style>
</head>
<body>

<header>
  <div class="logo">VibeBooks 📚</div>
  <div class="lang-switcher">
    <button class="btn" onclick="setLanguage('ar')">AR</button>
    <button class="btn" onclick="setLanguage('en')">EN</button>
  </div>
  <div id="auth-area">
    <button class="btn" id="login-btn" onclick="login()">تسجيل الدخول بجوجل</button>
  </div>
</header>

<div class="container">
  <div class="hero-section">
    <h1></h1>
    <p></p>
  </div>

  <div class="actions-bar">
    <button class="btn hidden" id="suggest-btn" onclick="openModal('suggest-modal')"></button>
    <button class="btn hidden" id="admin-upload-btn" onclick="openModal('admin-upload-modal')">📚 إضافة كتاب مباشرة</button>
  </div>

  <h2 id="approved-books-title"></h2>
  <div class="books-grid" id="approved-books"></div>

  <div id="admin-panel" class="admin-section hidden">
    <h2 id="pending-books-title"></h2>
    <div class="books-grid" id="pending-books"></div>
  </div>
</div>

<!-- نموذج اقتراح كتاب -->
<div class="modal" id="suggest-modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal('suggest-modal')">&times;</span>
    <h3></h3>
    <div class="form-group">
      <label id="label-title"></label>
      <input type="text" id="book-title-input">
    </div>
    <div class="form-group">
      <label id="label-desc"></label>
      <textarea id="book-desc-input" rows="3"></textarea>
    </div>
    <div class="form-group">
      <label id="label-url"></label>
      <input type="url" id="book-url-input" placeholder="https://...">
    </div>
    <div class="form-group">
      <label>رابط صورة الغلاف</label>
      <input type="url" id="book-cover-input" placeholder="https://...">
    </div>
    <button class="btn" style="width:100%" onclick="submitSuggestion()"></button>
  </div>
</div>

<!-- نموذج رفع كتاب مباشر -->
<div class="modal" id="admin-upload-modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal('admin-upload-modal')">&times;</span>
    <h3>إضافة كتاب مباشر</h3>
    <div class="form-group">
      <label>اسم الكتاب</label>
      <input type="text" id="admin-book-title">
    </div>
    <div class="form-group">
      <label>وصف الكتاب</label>
      <textarea id="admin-book-desc" rows="3"></textarea>
    </div>
    <div class="form-group">
      <label>رابط PDF</label>
      <input type="url" id="admin-book-url" placeholder="https://...">
    </div>
    <div class="form-group">
      <label>رابط صورة الغلاف</label>
      <input type="url" id="admin-book
