<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>VibeThemes - مكتبة الأفكار</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #0b0f19; color: white; padding: 20px; }
        .btn { background: #3b82f6; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>مرحباً بك في VibeThemes</h1>
    <div id="auth-status">جاري التحميل...</div>
    <button class="btn" id="login-btn" onclick="login()">تسجيل الدخول</button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDn2Tw54",
            authDomain: "vebi-f4fa3.firebaseapp.com",
            projectId: "vebi-f4fa3",
            storageBucket: "vebi-f4fa3.appspot.com",
            messagingSenderId: "914837852533",
            appId: "1:914837852533:web:e1cccc5cff378d879fc33c"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        // التعديل السحري لتجاوز مشكلة النطاق
        provider.setCustomParameters({
            'prompt': 'select_account'
        });

        function login() {
            auth.signInWithPopup(provider).catch(error => {
                console.error(error);
                alert("حدث خطأ: " + error.message);
            });
        }

        auth.onAuthStateChanged(user => {
            const status = document.getElementById('auth-status');
            const btn = document.getElementById('login-btn');
            if (user) {
                status.innerHTML = "أهلاً بك: " + user.displayName;
                btn.style.display = 'none';
            } else {
                status.innerHTML = "يرجى تسجيل الدخول للبدء";
                btn.style.display = 'inline-block';
            }
        });
    </script>
</body>
</html>
