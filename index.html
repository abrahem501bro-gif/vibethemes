<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeBooks | مكتبة إبراهيم الشنوان</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b0f19; --card: #151c2e; --primary: #3b82f6; --text: #f3f4f6; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; line-height: 1.6; }
        .container { max-width: 1000px; margin: auto; }
        .admin-panel { display: none; background: #1e293b; padding: 25px; border-radius: 15px; border: 2px solid var(--primary); margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid #2e3a56; transition: 0.3s; }
        .btn { padding: 12px 25px; background: var(--primary); color: white; border: none; cursor: pointer; border-radius: 8px; font-weight: bold; width: 100%; margin-top: 10px; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #334; background: #000; color: #fff; box-sizing: border-box; }
        footer { margin-top: 50px; padding: 30px; border-top: 1px solid #2e3a56; text-align: center; color: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align:center; color:var(--primary);">VibeBooks 📚</h1>
    
    <div id="admin-panel" class="admin-panel">
        <h2 style="margin-top:0;">لوحة الإدارة (إبراهيم الشنوان)</h2>
        <input type="text" id="b-title" placeholder="عنوان الكتاب">
        <textarea id="b-desc" placeholder="وصف الكتاب"></textarea>
        <input type="url" id="b-url" placeholder="رابط تحميل PDF">
        <button class="btn" onclick="addBook()">نشر الكتاب رسمياً</button>
    </div>

    <div id="auth-btn" style="text-align:center; margin-bottom:20px;">
        <button class="btn" style="width:auto;" onclick="login()">دخول المالك</button>
    </div>

    <h2>مكتبة الكتب</h2>
    <div id="books-grid" class="grid"></div>

    <footer>
        <p>كل الحقوق محفوظة © 2026 VibeBooks</p>
        <p>تصميم وتطوير: <span style="color:var(--primary); font-weight:bold;">إبراهيم الشنوان</span></p>
    </footer>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDn2Tw54",
        authDomain: "vebi-f4fa3.firebaseapp.com",
        projectId: "vebi-f4fa3",
        storageBucket: "vebi-f4fa3.appspot.com",
        messagingSenderId: "914837852533",
        appId: "1:914837852533:web:e1cccc5cff378d879fc33c"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // التحقق من الهوية لعرض لوحة التحكم
    auth.onAuthStateChanged(user => {
        if (user && user.email === "abrahem501bro@gmail.com") {
            document.getElementById('admin-panel').style.display = 'block';
            document.getElementById('auth-btn').style.display = 'none';
        }
    });

    function login() { auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()); }

    // وظيفة النشر المحمية
    async function addBook() {
        try {
            await db.collection('books').add({
                title: document.getElementById('b-title').value,
                desc: document.getElementById('b-desc').value,
                url: document.getElementById('b-url').value,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert("تم النشر بنجاح!");
            location.reload();
        } catch(e) {
            alert("خطأ: ليس لديك صلاحية النشر!");
        }
    }

    // عرض الكتب للجمهور
    db.collection("books").orderBy("createdAt", "desc").onSnapshot(snap => {
        const grid = document.getElementById('books-grid');
        grid.innerHTML = "";
        snap.forEach(doc => {
            const b = doc.data();
            grid.innerHTML += `
                <div class="card">
                    <h3>${b.title}</h3>
                    <p>${b.desc}</p>
                    <a href="${b.url}" target="_blank" class="btn" style="text-decoration:none; display:block; text-align:center;">تحميل الكتاب</a>
                </div>`;
        });
    });
</script>

</body>
</html>
